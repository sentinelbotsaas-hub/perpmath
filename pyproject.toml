[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "perpmath"
version = "0.2.0"
description = "A small, honest backtester for crypto perpetual-futures strategies on Bybit public data, with a grid simulator and a testnet-only order runner."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "perpmath contributors" }]
keywords = ["backtest", "crypto", "perpetual futures", "bybit", "trading research"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://perpmath.com"
Repository = "https://github.com/sentinelbotsaas-hub/perpmath"

[project.scripts]
perpmath = "perpmath.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
